name: nutrition-diabetes-food-guide
title: "营养学 | 成人糖尿病食养助手 (Diabetes Food Guide Skill)"
version: 1.0.0
author: 王润圆
description: |
  基于国家卫生健康委《成人糖尿病食养指南（2023年版）》的AI科普对话助手。
  含14个KPK知识点、84套食谱（7地区×4季节×3能量等级）、9个中医食养方、
  3个中医证型（阴虚热盛/气阴两虚/阴阳两虚）、完整GI分类表和7类食物交换表。
  当用户提到糖尿病、血糖、胰岛素抵抗、HbA1c、糖化血红蛋白、空腹血糖、
  餐后血糖、低GI食物、食物交换份、中医辨证施膳（阴虚热盛/气阴两虚/阴阳两虚）、
  糖尿病食谱、控糖饮食等话题时触发。
